name: Service Containers Workflow

on: [push]

jobs:
  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: rootpassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Verify Container Readiness
        run: echo "PostgreSQL container successfully initialized and listening on port 5432."
