name: Context Objects and Conditionals

on: [push]

env:
  CUSTOM_ENV_VAR: "Learning GitHub Actions"

jobs:
  context-inspection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Runtime Contexts
        run: |
          echo "Triggered by Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Custom Env: ${{ env.CUSTOM_ENV_VAR }}"

      - name: Conditional Execution Step
        if: ${{ contains(github.actor, 'Haseeb55859') && success() }}
        run: echo "Conditional step executed successfully for actor ${{ github.actor }}!"
