name: Data Management Secrets and Vars

on: [push]

jobs:
  secrets-job:
    runs-on: ubuntu-latest
    env:
      ENV_VAR: ${{ vars.APP_ENV }}
      SECRET_VAL: ${{ secrets.MY_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Access Config Variable and Secret
        run: |
          echo "Configured Environment Variable: $ENV_VAR"
          echo "Configured Encrypted Secret: $SECRET_VAL"

      - name: Verify GITHUB_TOKEN Availability
        run: |
          echo "GITHUB_TOKEN is active and automatically provided by GitHub Actions."
